<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Advik Gupta | Sticky Navbar and Card Overlay</title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-dark: #1e293b;
      --color-light: #f1f5f9;
      --color-white: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--color-light);
      color: var(--color-dark);
      line-height: 1.6;
    }

    nav {
      position: sticky;
      top: 0;
      background-color: var(--color-dark);
      padding: 16px;
      z-index: 100;
    }
    nav a {
      color: var(--color-white);
      text-decoration: none;
      margin-right: 16px;
    }

    section { padding: 40px 24px; }
    h2 { margin-bottom: 16px; }

    .card {
      position: relative;
      width: 300px;
      height: 200px;
      background-color: var(--color-primary);
      color: var(--color-white);
      border-radius: 8px;
      padding: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;               
      transition: opacity 0.3s;
    }

    .card:hover .overlay { opacity: 1; }  
  </style>
</head>
<body>

  <nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="about">
    <h2>About A Advik Gupta</h2>
    <p>BTech CSE (AI/ML) student at Bosscoder School of Technology. Scroll down. The navbar stays at the top.</p>
    <p style="height: 400px;"></p>
  </section>

  <section id="projects">
    <h2>Projects</h2>

    <div class="card">
      <h3>Project One</h3>
      <p>Hover over me!</p>
      <div class="overlay">View Project</div>
    </div>

    <div class="card">
      <h3>Project Two</h3>
      <p>Hover over me!</p>
      <div class="overlay">View Project</div>
    </div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>advikguptaallampally@gmail.com</p>
    <p style="height: 400px;"></p>
  </section>

</body>
</html>
