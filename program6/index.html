<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Advik Gupta </title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-dark: #1e293b;
      --color-light: #f1f5f9;
      --color-white: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--color-light);
      color: var(--color-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }


    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background-color: var(--color-dark);
      color: var(--color-white);
      padding: 16px 24px;
    }

    header nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }
    header a { color: var(--color-white); text-decoration: none; }

    .hire-btn {
      background-color: var(--color-primary);
      color: var(--color-white);
      padding: 8px 16px;
      border-radius: 6px;
    }


    main {
      flex: 1;
      padding: 24px;
    }


    footer {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 24px;
      background-color: var(--color-dark);
      color: var(--color-white);
      padding: 24px;
    }
    footer ul { list-style: none; }
    footer li { margin-bottom: 6px; }
    footer a { color: var(--color-white); text-decoration: none; }

    @media (max-width: 600px) {
      header { flex-direction: column; }
      footer { flex-direction: column; align-items: center; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <h1>A Advik Gupta</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <a class="hire-btn" href="mailto:advikguptaallampally@gmail.com">Hire Me</a>
  </header>

  <main>
    <h2>Welcome</h2>
    <p>I am a BTech CSE (AI/ML) student at Bosscoder School of Technology.</p>
  </main>

  <footer>
    <div>
      <h3>Quick Links</h3>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
      </ul>
    </div>
    <div>
      <h3>Social</h3>
      <ul>
        <li><a href="#">GitHub</a></li>
        <li><a href="#">LinkedIn</a></li>
      </ul>
    </div>
    <div>
      <h3>Contact</h3>
      <p>advikguptaallampally@gmail.com</p>
      <p>Bosscoder School of Technology</p>
    </div>
  </footer>

</body>
</html>
